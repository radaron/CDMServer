name: Publish CLI to PyPI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'cli/pyproject.toml'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build and publish
        working-directory: cli
        run: |
          uv build
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
