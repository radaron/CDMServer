services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
  cdm-server:
    build: .
    platform: linux/amd64
    container_name: cdm
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    volumes:
      - torrent-files:/torrents
  cdm-worker:
    build: .
    platform: linux/amd64
    container_name: cdm-worker
    command: >
      python -m celery -A worker.celery_app worker
      --beat --loglevel=info
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    volumes:
      - torrent-files:/torrents

volumes:
  torrent-files:
