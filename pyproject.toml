[project]
name = "CDMServer"
version = "3.3.0"
description = "A short description of your project"
authors = [{name = "Aron Radics", email = "radics.aron.jozsef@gmail.com"}]
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "fastapi-login",
  "uvicorn",
  "sqlalchemy[asyncio]",
  "aiomysql",
  "mysqlclient",
  "cryptography",
  "pydantic[email]",
  "passlib[bcrypt]",
  "jinja2",
  "ncoreparser",
  "redis",
  "aiohttp>=3.13.3",
  "themoviedb>=1.0.2",
  # It is need because: https://github.com/pyca/bcrypt/issues/684
  "bcrypt==3.2.2",
  "celery[redis]>=5.4",
  "pydantic-settings>=2.15.0",
  "pymysql>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.1",
    "ty>=0.0.1a6",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# SQLAlchemy 1.4-style Column types are not recognised by ty — suppress until migration to Mapped[]
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
# FastAPI-login @manager.user_loader() decorator opaque to ty
call-non-callable = "ignore"
# pydantic ConfigDict keys not in ty's TypedDict stubs
invalid-key = "ignore"
