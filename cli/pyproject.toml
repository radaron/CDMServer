[project]
name = "CDMServerCli"
version = "1.2.0"
description = "CDM Server CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
cdm = "CDMServerCli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
