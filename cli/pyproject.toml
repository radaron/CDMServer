[project]
name = "CDMCli"
version = "1.5.3"
description = "CDM CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
cdm = "CDMCli.main:app"

[dependency-groups]
dev = [
    "dev-dependencies",
]

[tool.uv.sources]
dev-dependencies = { path = "../common/dev_dependencies", editable = true }

[tool.ty.environment]
python-version = "3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
