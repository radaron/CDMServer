[project]
name = "cdmclient"
version = "1.2.7"
description = "CDM - Centralized Download Manager Client"
authors = [{name = "Aron Radics", email = "radics.aron.jozsef@gmail.com"}]
requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "requests",
  "transmission_rpc",
  "cryptography",
  "sqlalchemy>=2.0.0",
  "qbittorrent-api>=2025.7.0",
]

[project.urls]
Homepage = "https://github.com/radaron/CDMServer/tree/master/client"
Repository = "https://github.com/radaron/CDMServer"

[project.scripts]
cdm-client = "cdm_client.cdm_client:main"

[dependency-groups]
dev = [
    "types-requests>=2.32.4.20250913",
]

[tool.ty.environment]
python-version = "3.9"

[tool.ty.rules]
# SQLAlchemy 1.4-style Column types are not recognised by ty — suppress until migration to Mapped[]
invalid-assignment = "ignore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdm_client"]
