[project]
name = "cdmctl"
version = "1.5.6"
description = "CDM - Centralized Download Manager CLI"
authors = [{name = "Aron Radics", email = "radaron@radaron.hu"}]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/radaron/CDMServer/tree/master/cli"
Repository = "https://github.com/radaron/CDMServer"

[project.scripts]
cdm = "cdmctl.main:app"

[tool.ty.environment]
python-version = "3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
