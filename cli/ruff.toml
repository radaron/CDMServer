[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "ANN", # flake8-annotations (require type annotations everywhere)
]
ignore = [
    "ANN401", # Any is acceptable for heterogeneous params / external library types
]

[lint.flake8-annotations]
suppress-none-returning = true

[format]
quote-style = "double"
indent-style = "space"
